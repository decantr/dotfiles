monitor.alsa.rules = [
	{
		matches = [
			{ device.name = "alsa_card.usb-Topping_MX5-00" }
			{ node.name = "~alsa_output.usb-Topping_MX5-00.*" }
		]
		actions = {
			update-props = {
				# on resume the node can return as ...sink.2 before the old one is
				# torn down, so the saved default stops matching. every other card
				# is off, leaving no default at all unless priority picks this one.
				priority.driver = 2000
				priority.session = 2000
			}
		}
	}
]
